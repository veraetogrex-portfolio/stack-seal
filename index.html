<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stack Seal — veraetogrex_portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Stack Seal · zero dependencies · github.com/veraetogrex-portfolio -->
  <div class="flood" aria-hidden="true"></div>
  <div class="shock" aria-hidden="true"></div>

  <main class="deploy">
    <section class="gate" id="gate" aria-labelledby="gate-title">
      <div class="gate-glow" aria-hidden="true"></div>
      <p class="kicker">Release gate</p>
      <div class="titles">
        <h1 class="title" id="gate-title">Confirm deploy to production</h1>
        <p class="title title-ok" aria-hidden="true">Deploy confirmed</p>
      </div>
      <p class="release"><i></i><b>ORB-14</b> · v1.0.3 → <span>prod</span></p>

      <div class="cells" aria-hidden="true">
        <div class="cell"><span></span></div><div class="cell"><span></span></div><div class="cell"><span></span></div>
        <div class="cell"><span></span></div><div class="cell"><span></span></div><div class="cell"><span></span></div>
      </div>
      <input class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="6-digit authenticator code">
      <button class="hint" type="button" tabindex="-1" title="Fill from authenticator">
        <span class="hint-app">Authenticator</span> · <b>482 913</b>
      </button>
      <div class="scan" aria-hidden="true"><i></i></div>
      <p class="foot" role="status">Code from your authenticator app</p>

      <div class="seal" aria-hidden="true">
        <div class="wave"></div><div class="wave"></div>
        <div class="stamp"><svg viewBox="0 0 76 76"><path d="M18 40 L32 53 L59 24" pathLength="100"/></svg></div>
      </div>
    </section>

    <div class="ship" role="status">
      <div class="ship-top"><span class="ship-label"><i></i><span>Shipping v1.0.3</span></span><span class="ship-pct">0%</span></div>
      <div class="ship-bar"><b></b></div>
      <div class="ship-regions">eu-west · us-east · ap-south</div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
